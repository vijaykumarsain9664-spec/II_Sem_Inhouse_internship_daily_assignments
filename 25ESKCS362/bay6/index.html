<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Cards</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
  body {
    background: #f7f7f5;
  }
  .card {
    height: 100%;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 16px rgba(0,0,0,0.15);
  }
  .card-img-top {
    height: 180px;
    object-fit: contain;
    padding: 1rem;
    background: #fff;
  }
  .price {
    font-weight: bold;
    color: #2e7d32;
  }
</style>
</head>
<body>

<div class="container py-5">

  <h1 class="mb-4">Product Catalog</h1>

  <!-- Search box -->
  <input type="text" id="search" class="form-control mb-4" placeholder="Search products...">

  <!-- Loading message -->
  <div id="loading" class="text-center py-5">
    <div class="spinner-border text-success" role="status"></div>
    <p class="mt-3">Loading products...</p>
  </div>

  <!-- Error message -->
  <div id="error" class="alert alert-danger d-none"></div>

  <!-- Cards go here -->
  <div id="cards" class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4"></div>

</div>

<script>
  const cardsDiv = document.getElementById("cards");
  const loadingDiv = document.getElementById("loading");
  const errorDiv = document.getElementById("error");
  const searchInput = document.getElementById("search");

  let products = [];

  // Fetch data from the API
  fetch("https://fakestoreapi.com/products")
    .then(response => {
      if (!response.ok) {
        throw new Error("Failed to load products (status " + response.status + ")");
      }
      return response.json();
    })
    .then(data => {
      products = data;
      loadingDiv.classList.add("d-none");
      showProducts(products);
    })
    .catch(error => {
      loadingDiv.classList.add("d-none");
      errorDiv.textContent = error.message;
      errorDiv.classList.remove("d-none");
    });

  // Render product cards
  function showProducts(list) {
    cardsDiv.innerHTML = "";

    if (list.length === 0) {
      cardsDiv.innerHTML = "<p>No products found.</p>";
      return;
    }

    list.forEach(product => {
      const col = document.createElement("div");
      col.className = "col";

      col.innerHTML = `
        <div class="card">
          <img src="${product.image}" class="card-img-top" alt="${product.title}">
          <div class="card-body d-flex flex-column">
            <h6 class="card-title">${product.title}</h6>
            <p class="text-muted small mb-1">${product.category}</p>
            <p class="price mb-2">$${product.price.toFixed(2)}</p>
            <p class="small mb-0">⭐ ${product.rating.rate} (${product.rating.count} reviews)</p>
          </div>
        </div>
      `;

      cardsDiv.appendChild(col);
    });
  }

  // Simple search/filter
  searchInput.addEventListener("input", () => {
    const query = searchInput.value.toLowerCase();
    const filtered = products.filter(p => p.title.toLowerCase().includes(query));
    showProducts(filtered);
  });
</script>

</body>
</html>
