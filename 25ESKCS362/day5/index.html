<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registry</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#101B33;
  --ink-2:#1D2C4F;
  --steel:#3A5A8C;
  --paper:#F3F5F8;
  --card:#FFFFFF;
  --gold:#E8A33D;
  --grade-high:#2F8F5B;
  --grade-mid:#D98F2B;
  --grade-low:#8A8F98;
  --muted:#6B7280;
  --line:#E3E7EE;
  --radius:18px;

  /* vivid branch palette */
  --c-cse:#7C3AED;
  --c-ece:#0D9488;
  --c-me:#E11D48;
  --c-ce:#2563EB;
  --c-it:#DB2777;
  --c-eee:#D97706;
}

*{box-sizing:border-box;}

body{
  background:var(--paper);
  background-image:
    radial-gradient(circle at 1px 1px, rgba(16,27,51,0.055) 1px, transparent 0);
  background-size: 22px 22px;
  font-family:'Inter', sans-serif;
  color:var(--ink);
  min-height:100vh;
  position:relative;
  overflow-x:hidden;
}

/* drifting ambient color blobs */
.bg-blob{
  position:fixed;
  width:520px; height:520px;
  border-radius:50%;
  filter:blur(90px);
  opacity:.22;
  z-index:0;
  pointer-events:none;
  animation:drift 22s ease-in-out infinite;
}
.bg-blob.b1{ top:-180px; left:-160px; background:var(--c-cse); animation-duration:26s; }
.bg-blob.b2{ bottom:-200px; right:-160px; background:var(--c-it); animation-duration:30s; animation-delay:-8s; }
.bg-blob.b3{ top:40%; left:60%; background:var(--c-eee); animation-duration:24s; animation-delay:-4s; }

@keyframes drift{
  0%,100%{ transform:translate(0,0) scale(1); }
  33%{ transform:translate(40px,-30px) scale(1.08); }
  66%{ transform:translate(-30px,25px) scale(.95); }
}

/* ---------- NAVBAR ---------- */
.registry-nav{
  background:var(--ink);
  padding:.9rem 0;
  position:relative;
  z-index:10;
}
.registry-nav::after{
  content:"";
  position:absolute;
  left:0; right:0; bottom:-3px;
  height:3px;
  background:linear-gradient(90deg,
    var(--c-cse), var(--c-ece), var(--c-me), var(--c-ce), var(--c-it), var(--c-eee), var(--c-cse));
  background-size:200% 100%;
  animation:rainbowSlide 6s linear infinite;
}
@keyframes rainbowSlide{
  0%{background-position:0% 0;}
  100%{background-position:200% 0;}
}
.brand-mark{
  font-family:'Fraunces', serif;
  font-weight:700;
  font-size:1.35rem;
  color:#fff;
  letter-spacing:.2px;
  display:flex;
  align-items:center;
  gap:.55rem;
}
.brand-mark .dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 0 3px rgba(232,163,61,.25);
  animation:pulseDot 2s ease-in-out infinite;
}
@keyframes pulseDot{
  0%,100%{ box-shadow:0 0 0 3px rgba(232,163,61,.25); transform:scale(1); }
  50%{ box-shadow:0 0 0 7px rgba(232,163,61,.08); transform:scale(1.15); }
}
.brand-sub{
  font-family:'JetBrains Mono', monospace;
  font-size:.68rem;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:#9FB0D6;
  margin-left:2rem;
}

.search-wrap{
  max-width:420px;
}
.search-wrap .form-control{
  background:#16224A;
  border:1px solid #2C3D68;
  color:#fff;
  font-family:'Inter',sans-serif;
  font-size:.92rem;
}
.search-wrap .form-control::placeholder{color:#8393BC;}
.search-wrap .form-control:focus{
  background:#16224A;
  color:#fff;
  border-color:var(--gold);
  box-shadow:0 0 0 .18rem rgba(232,163,61,.22);
}
.search-wrap .input-group-text{
  background:#16224A;
  border:1px solid #2C3D68;
  border-right:none;
  color:#9FB0D6;
}

/* ---------- FILTER BAR ---------- */
.filter-bar{
  background:var(--card);
  border-bottom:1px solid var(--line);
  padding:1.1rem 0;
  position:sticky;
  top:0;
  z-index:20;
}
.filter-label{
  font-family:'JetBrains Mono', monospace;
  font-size:.68rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:.4rem;
  display:block;
}
.branch-chip{
  border:1.5px solid var(--line);
  background:#fff;
  color:var(--ink-2);
  font-family:'Space Grotesk', sans-serif;
  font-weight:600;
  font-size:.82rem;
  padding:.36rem .9rem;
  border-radius:999px;
  cursor:pointer;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), border-color .18s ease, background .18s ease, color .18s ease, box-shadow .18s ease;
  white-space:nowrap;
}
.branch-chip:hover{transform:translateY(-2px) scale(1.04);}
.branch-chip.active{
  color:#fff;
  transform:translateY(-1px) scale(1.05);
  animation:chipPop .35s cubic-bezier(.34,1.56,.64,1);
}
@keyframes chipPop{
  0%{ transform:scale(.85); }
  60%{ transform:scale(1.1); }
  100%{ transform:scale(1.05); }
}
.chip-dot{
  width:7px;height:7px;border-radius:50%;
  display:inline-block;
  margin-right:.4rem;
  background:var(--steel);
}
.branch-chip.active .chip-dot{background:#fff;}

/* per-branch chip theming */
.branch-chip[data-branch="all"]:hover{border-color:var(--ink);}
.branch-chip[data-branch="all"].active{background:var(--ink); border-color:var(--ink); box-shadow:0 6px 16px rgba(16,27,51,.28);}

.branch-chip[data-branch="CSE"] .chip-dot{background:var(--c-cse);}
.branch-chip[data-branch="CSE"]:hover{border-color:var(--c-cse);}
.branch-chip[data-branch="CSE"].active{background:var(--c-cse); border-color:var(--c-cse); box-shadow:0 6px 16px rgba(124,58,237,.35);}

.branch-chip[data-branch="ECE"] .chip-dot{background:var(--c-ece);}
.branch-chip[data-branch="ECE"]:hover{border-color:var(--c-ece);}
.branch-chip[data-branch="ECE"].active{background:var(--c-ece); border-color:var(--c-ece); box-shadow:0 6px 16px rgba(13,148,136,.35);}

.branch-chip[data-branch="ME"] .chip-dot{background:var(--c-me);}
.branch-chip[data-branch="ME"]:hover{border-color:var(--c-me);}
.branch-chip[data-branch="ME"].active{background:var(--c-me); border-color:var(--c-me); box-shadow:0 6px 16px rgba(225,29,72,.35);}

.branch-chip[data-branch="CE"] .chip-dot{background:var(--c-ce);}
.branch-chip[data-branch="CE"]:hover{border-color:var(--c-ce);}
.branch-chip[data-branch="CE"].active{background:var(--c-ce); border-color:var(--c-ce); box-shadow:0 6px 16px rgba(37,99,235,.35);}

.branch-chip[data-branch="IT"] .chip-dot{background:var(--c-it);}
.branch-chip[data-branch="IT"]:hover{border-color:var(--c-it);}
.branch-chip[data-branch="IT"].active{background:var(--c-it); border-color:var(--c-it); box-shadow:0 6px 16px rgba(219,39,119,.35);}

.branch-chip[data-branch="EEE"] .chip-dot{background:var(--c-eee);}
.branch-chip[data-branch="EEE"]:hover{border-color:var(--c-eee);}
.branch-chip[data-branch="EEE"].active{background:var(--c-eee); border-color:var(--c-eee); box-shadow:0 6px 16px rgba(217,119,6,.35);}

.cgpa-range{
  width:100%;
  accent-color:var(--ink);
}
.cgpa-readout{
  font-family:'JetBrains Mono', monospace;
  font-weight:700;
  font-size:.9rem;
  color:var(--ink);
  background:#EFF2F7;
  border-radius:6px;
  padding:.1rem .5rem;
}

/* ---------- RESULT META ---------- */
.result-meta{
  font-family:'JetBrains Mono', monospace;
  font-size:.75rem;
  color:var(--muted);
  letter-spacing:.04em;
}
.result-meta b{color:var(--ink);}

/* ---------- CARDS ---------- */
.card-grid{
  padding:2.2rem 0 4rem;
}

.id-card{
  --bc:var(--steel);
  background:var(--card);
  border-radius:var(--radius);
  border:1px solid var(--line);
  box-shadow:0 1px 2px rgba(16,27,51,.04);
  padding:1.9rem 1.25rem 1.35rem;
  position:relative;
  overflow:visible;
  height:100%;
  opacity:0;
  transform:translateY(24px) scale(.94) rotate(-2deg);
  animation:cardIn .6s cubic-bezier(.22,1,.36,1) forwards;
  transition:box-shadow .3s ease, transform .3s ease, border-color .3s ease;
}
.id-card::before{ z-index:2; }
.id-card::after{ z-index:2; }
.id-card > *{ position:relative; z-index:1; }
.id-card > .top-accent{
  position:absolute;
  top:0; left:0; right:0;
  height:5px;
  background:var(--bc);
  z-index:1;
  border-radius:var(--radius) var(--radius) 0 0;
}
.id-card:hover{
  box-shadow:0 20px 38px -8px color-mix(in srgb, var(--bc) 45%, rgba(16,27,51,.2));
  transform:translateY(-6px) scale(1.015);
  border-color:var(--bc);
}

@keyframes cardIn{
  0%{opacity:0; transform:translateY(24px) scale(.94) rotate(-2deg);}
  60%{opacity:1;}
  100%{opacity:1; transform:translateY(0) scale(1) rotate(0);}
}

/* punch hole + lanyard */
.id-card::before{
  content:"";
  position:absolute;
  top:-9px; left:50%;
  transform:translateX(-50%);
  width:26px; height:14px;
  background:var(--paper);
  border:1px solid var(--line);
  border-bottom:none;
  border-radius:8px 8px 0 0;
}
.id-card::after{
  content:"";
  position:absolute;
  top:-3px; left:50%;
  transform:translateX(-50%);
  width:10px; height:10px;
  background:var(--paper);
  border:1px solid #CBD3E0;
  border-radius:50%;
}

.branch-tab{
  position:absolute;
  top:1.1rem; right:0;
  transform:translateX(30%);
  font-family:'JetBrains Mono', monospace;
  font-size:.66rem;
  font-weight:700;
  letter-spacing:.08em;
  color:#fff;
  padding:.28rem .55rem .28rem .7rem;
  border-radius:6px 0 0 6px;
  background:var(--bc);
  box-shadow:-2px 3px 8px rgba(16,27,51,.18);
  transition:transform .3s ease;
}

/* ---------- FLIP CARD ---------- */
.flip-scene{
  perspective:1200px;
  min-height:300px;
}
.flip-inner{
  position:relative;
  width:100%;
  height:100%;
  transition:transform .7s cubic-bezier(.4,.15,.2,1);
  transform-style:preserve-3d;
}
.id-card:hover .flip-inner, .id-card.flipped .flip-inner{
  transform:rotateY(180deg);
}
.id-card:hover .branch-tab, .id-card.flipped .branch-tab{ transform:translateX(30%) scale(0); }
.flip-front, .flip-back{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  display:flex;
  flex-direction:column;
}
.flip-back{
  transform:rotateY(180deg);
  justify-content:flex-start;
}
.flip-hint{
  text-align:center;
  font-family:'JetBrains Mono', monospace;
  font-size:.62rem;
  letter-spacing:.06em;
  color:var(--muted);
  opacity:.75;
  margin-top:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:.3rem;
}
.flip-hint i{ animation:hintSpin 3s linear infinite; font-size:.8rem; }
@keyframes hintSpin{ to{ transform:rotate(360deg); } }

.fb-eyebrow{
  font-family:'JetBrains Mono', monospace;
  font-size:.64rem;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-bottom:.3rem;
}
.fb-name{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:1.05rem;
  color:var(--ink);
  margin-bottom:.1rem;
}
.fb-roll{
  font-family:'JetBrains Mono', monospace;
  font-size:.7rem;
  letter-spacing:.06em;
  color:var(--muted);
  margin-bottom:.7rem;
}
.fb-email{
  font-size:.78rem;
  color:var(--ink-2);
  display:flex;
  align-items:center;
  gap:.4rem;
  margin-bottom:.85rem;
  word-break:break-word;
}
.fb-email i{ color:var(--muted); }

.avatar-ring{
  width:74px; height:74px;
  border-radius:50%;
  padding:3px;
  background:conic-gradient(var(--bc), var(--gold), var(--bc));
  margin:0 auto .8rem;
  animation:spinRing 5s linear infinite;
}
.avatar-ring img{
  width:100%; height:100%;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #fff;
  display:block;
  animation:spinRing 5s linear infinite reverse;
}
@keyframes spinRing{
  to{ transform:rotate(360deg); }
}

.stu-name{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:1.12rem;
  text-align:center;
  margin-bottom:.15rem;
  color:var(--ink);
}
.stu-roll{
  font-family:'JetBrains Mono', monospace;
  font-size:.72rem;
  letter-spacing:.08em;
  text-align:center;
  color:var(--muted);
  margin-bottom:1rem;
}

.card-divider{
  border-top:1px dashed var(--line);
  margin:0 0 1rem;
}

.meta-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:.83rem;
  margin-bottom:.55rem;
}
.meta-row .k{
  color:var(--muted);
  font-family:'Space Grotesk', sans-serif;
  font-weight:500;
}
.meta-row .v{
  font-family:'Space Grotesk', sans-serif;
  font-weight:600;
  color:var(--ink-2);
}

.stamp{
  position:absolute;
  bottom:1.1rem; right:1.1rem;
  width:64px; height:64px;
  border-radius:50%;
  border:2px dashed;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  transform:rotate(-11deg);
  font-family:'JetBrains Mono', monospace;
  line-height:1;
  background:rgba(255,255,255,.6);
}
.stamp .num{font-size:1rem; font-weight:700;}
.stamp .lbl{font-size:.5rem; letter-spacing:.1em; margin-top:2px;}

.grade-high{color:var(--grade-high); border-color:var(--grade-high); animation:stampPulse 2.4s ease-in-out infinite;}
.grade-mid{color:var(--grade-mid); border-color:var(--grade-mid);}
.grade-low{color:var(--grade-low); border-color:var(--grade-low);}

@keyframes stampPulse{
  0%,100%{ transform:rotate(-11deg) scale(1); }
  50%{ transform:rotate(-11deg) scale(1.08); }
}

.btn-view{
  width:100%;
  background:var(--bc, var(--ink));
  color:#fff;
  border:none;
  font-family:'Space Grotesk', sans-serif;
  font-weight:600;
  font-size:.85rem;
  border-radius:9px;
  padding:.55rem 0;
  transition:filter .18s ease, transform .18s ease, box-shadow .18s ease;
}
.btn-view:hover{filter:brightness(1.12); box-shadow:0 6px 14px -2px color-mix(in srgb, var(--bc) 55%, transparent);}
.btn-view:active{transform:scale(.97);}

/* empty state */
.empty-state{
  display:none;
  text-align:center;
  padding:4.5rem 1rem;
}
.empty-state.show{display:block;}
.empty-state i{font-size:2.2rem; color:var(--steel); margin-bottom:1rem;}
.empty-state h4{font-family:'Fraunces', serif; margin-bottom:.4rem;}
.empty-state p{color:var(--muted); font-size:.92rem;}

/* modal */
.modal-content{border-radius:16px; border:none;}
.modal-header{border-bottom:1px solid var(--line);}
.modal-title{font-family:'Fraunces', serif; font-weight:600;}

/* stagger via nth-child, JS also sets inline delay for filtered items */
.id-card{animation-delay:calc(var(--i, 0) * 60ms);}

@media (prefers-reduced-motion: reduce){
  .id-card{animation:none; opacity:1; transform:none;}
  .id-card:hover{transform:none;}
  .bg-blob, .registry-nav::after, .brand-mark .dot,
  .avatar-ring, .avatar-ring img, .grade-high, .branch-chip.active{
    animation:none !important;
  }
  .flip-inner{ transition:none; }
  .id-card:hover .flip-inner, .id-card.flipped .flip-inner{ transform:none; }
  .flip-back{ display:none; }
}
</style>
</head>
<body>
<div class="bg-blob b1"></div>
<div class="bg-blob b2"></div>
<div class="bg-blob b3"></div>

<!-- NAVBAR -->
<nav class="registry-nav">
  <div class="container">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
      <div class="d-flex align-items-center flex-wrap">
        <div class="brand-mark"><span class="dot"></span>Student Registry</div>
        <span class="brand-sub d-none d-lg-inline">Academic Directory</span>
      </div>
      <div class="search-wrap flex-grow-1">
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input id="searchInput" type="text" class="form-control" placeholder="Search by name or roll number…">
        </div>
      </div>
    </div>
  </div>
</nav>

<!-- FILTER BAR -->
<div class="filter-bar">
  <div class="container">
    <div class="row g-4 align-items-end">
      <div class="col-lg-8">
        <span class="filter-label">Filter by branch</span>
        <div class="d-flex gap-2 flex-wrap" id="branchChips">
          <button class="branch-chip active" data-branch="all"><span class="chip-dot"></span>All Branches</button>
          <button class="branch-chip" data-branch="CSE"><span class="chip-dot"></span>CSE</button>
          <button class="branch-chip" data-branch="ECE"><span class="chip-dot"></span>ECE</button>
          <button class="branch-chip" data-branch="ME"><span class="chip-dot"></span>ME</button>
          <button class="branch-chip" data-branch="CE"><span class="chip-dot"></span>CE</button>
          <button class="branch-chip" data-branch="IT"><span class="chip-dot"></span>IT</button>
          <button class="branch-chip" data-branch="EEE"><span class="chip-dot"></span>EEE</button>
        </div>
      </div>
      <div class="col-lg-4">
        <span class="filter-label">Minimum CGPA — <span class="cgpa-readout" id="cgpaReadout">6.0</span></span>
        <input type="range" class="form-range cgpa-range" id="cgpaRange" min="6" max="10" step="0.1" value="6">
      </div>
    </div>
    <div class="mt-3 result-meta" id="resultMeta"></div>
  </div>
</div>

<!-- CARDS -->
<div class="container card-grid">
  <div class="row g-4" id="cardContainer"></div>
  <div class="empty-state" id="emptyState">
    <i class="bi bi-folder-x"></i>
    <h4>No matching records</h4>
    <p>Try a different name, roll number, branch, or lower the CGPA threshold.</p>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal fade" id="studentModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalName">Student Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>

  {name:'Harsh Saxena', roll:'CE21012', branch:'CE', cgpa:8.7, sem:6, email:'harsh.saxena@vitcamp.edu'},

let state = { query:"", branch:"all", minCgpa:6.0 };

function gradeClass(cgpa){
  if(cgpa >= 8.5) return "grade-high";
  if(cgpa >= 7.0) return "grade-mid";
  return "grade-low";
}

function initials(name){
  return name.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
}

function avatarUrl(name){
  const bg = "1D2C4F";
  return `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=${bg}&color=fff&font-size=0.38&bold=true`;
}

function render(){
  const container = document.getElementById("cardContainer");
  const empty = document.getElementById("emptyState");
  const meta = document.getElementById("resultMeta");

  const q = state.query.trim().toLowerCase();
  const filtered = students.filter(s=>{
    const matchesQuery = !q || s.name.toLowerCase().includes(q) || s.roll.toLowerCase().includes(q);
    const matchesBranch = state.branch === "all" || s.branch === state.branch;
    const matchesCgpa = s.cgpa >= state.minCgpa;
    return matchesQuery && matchesBranch && matchesCgpa;
  });

  container.innerHTML = "";

  filtered.forEach((s, i)=>{
    const col = document.createElement("div");
    col.className = "col-sm-6 col-lg-4 col-xl-3";
    const gc = gradeClass(s.cgpa);
    const color = branchColors[s.branch];
    col.innerHTML = `
      <div class="id-card" style="--i:${Math.min(i, 14)}; --bc:${color};">
        <div class="top-accent"></div>
        <span class="branch-tab">${s.branch}</span>
        <div class="flip-scene">
          <div class="flip-inner">

            <div class="flip-front">
              <div class="avatar-ring">
                <img src="${avatarUrl(s.name)}" alt="${s.name}">
              </div>
              <div class="stu-name">${s.name}</div>
              <div class="stu-roll">${s.roll}</div>
              <div class="card-divider"></div>
              <div class="meta-row"><span class="k">Branch</span><span class="v" style="color:${color}">${s.branch}</span></div>
              <div class="meta-row"><span class="k">Semester</span><span class="v">${s.sem}</span></div>
              <div class="flip-hint"><i class="bi bi-arrow-repeat"></i> hover to flip</div>
              <div class="stamp ${gc}">
                <span class="num">${s.cgpa.toFixed(1)}</span>
                <span class="lbl">CGPA</span>
              </div>
            </div>

            <div class="flip-back">
              <div class="fb-eyebrow" style="color:${color}">Full Profile</div>
              <div class="fb-name">${s.name}</div>
              <div class="fb-roll">${s.roll}</div>
              <div class="card-divider"></div>
              <div class="fb-email"><i class="bi bi-envelope"></i> ${s.email}</div>
              <div class="meta-row"><span class="k">Branch</span><span class="v" style="color:${color}">${s.branch}</span></div>
              <div class="meta-row"><span class="k">Semester</span><span class="v">${s.sem}</span></div>
              <div class="meta-row"><span class="k">CGPA</span><span class="v ${gc}">${s.cgpa.toFixed(1)}</span></div>
              <button class="btn-view mt-2" data-roll="${s.roll}">View Full Details</button>
            </div>

          </div>
        </div>
      </div>
    `;
    container.appendChild(col);
  });

  empty.classList.toggle("show", filtered.length === 0);
  meta.innerHTML = `Showing <b>${filtered.length}</b> of <b>${students.length}</b> student records`;

  container.querySelectorAll(".btn-view").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      openModal(btn.dataset.roll);
    });
  });

  // touch devices: tap the card to flip it (hover isn't available)
  if(window.matchMedia("(hover: none)").matches){
    container.querySelectorAll(".id-card").forEach(card=>{
      card.addEventListener("click", (e)=>{
        if(e.target.closest(".btn-view")) return;
        card.classList.toggle("flipped");
      });
    });
  }
}

function openModal(roll){
  const s = students.find(st=>st.roll === roll);
  document.getElementById("modalName").textContent = s.name;
  const gc = gradeClass(s.cgpa);
  document.getElementById("modalBody").innerHTML = `
    <div class="d-flex align-items-center gap-3 mb-3">
      <img src="${avatarUrl(s.name)}" alt="${s.name}" style="width:64px;height:64px;border-radius:50%;">
      <div>
        <div class="fw-semibold">${s.roll}</div>
        <div class="text-muted small">${s.email}</div>
      </div>
    </div>
    <div class="meta-row"><span class="k">Branch</span><span class="v">${s.branch}</span></div>
    <div class="meta-row"><span class="k">Semester</span><span class="v">${s.sem}</span></div>
    <div class="meta-row"><span class="k">CGPA</span><span class="v ${gc}">${s.cgpa.toFixed(1)}</span></div>
  `;
  new bootstrap.Modal(document.getElementById("studentModal")).show();
}

document.getElementById("searchInput").addEventListener("input", e=>{
  state.query = e.target.value;
  render();
});

document.getElementById("branchChips").addEventListener("click", e=>{
  const chip = e.target.closest(".branch-chip");
  if(!chip) return;
  document.querySelectorAll(".branch-chip").forEach(c=>c.classList.remove("active"));
  chip.classList.add("active");
  state.branch = chip.dataset.branch;
  render();
});

document.getElementById("cgpaRange").addEventListener("input", e=>{
  state.minCgpa = parseFloat(e.target.value);
  document.getElementById("cgpaReadout").textContent = state.minCgpa.toFixed(1);
  render();
});
